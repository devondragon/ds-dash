# Tool config only — this project is not packaged; it runs from the repo
# via run.sh. Install deps with requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

# State the rule set explicitly instead of inheriting ruff's defaults.
# requirements-dev.txt floats (`ruff>=0.5`), so CI picks up new releases: ruff
# 0.16 widened its default selection and turned ~35 findings into build
# failures across untouched files — none of them regressions, several of them
# contradicting this project's documented conventions (BLE001 vs. the
# "catch broadly, write status: error" rule in CLAUDE.md; B008 vs. FastAPI's
# `Body()` defaults). E4/E7/E9/F is what 0.15 enforced, i.e. the contract this
# code was actually written against.
#
# Adopting a new family is now a deliberate edit here, not a surprise from a
# `pip install`.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
